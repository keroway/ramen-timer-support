name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # push:branches:[main] のみでトリガーされ、PR 経由の未信頼コードは実行されないため誤検知。
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # zizmor: ignore[cache-poisoning] v6.0.9
        with:
          version: 11.17.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # zizmor: ignore[cache-poisoning] v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pages rejects non-ASCII commit messages in its deployment API.
          command: pages deploy dist --project-name=ramen-timer-support --commit-hash=${{ github.sha }} --commit-message=${{ github.sha }}

      # デプロイが success でも配信が壊れるケース（ビルド成果物が空、DNS/ルーティングの
      # 破損など）を検知する。このサイトが配信する /privacy/ は App Store Connect と
      # Google Play Console の両方に登録するプライバシーポリシー URL であり
      # (keroway/ramen-timer-mobile#130)、404 を返すと審査差し戻しの理由になる。
      #
      # 対象は**ストアが参照する 2 URL に限る**。サイト全体のリンクチェックは別の関心事。
      # 末尾スラッシュ付きで確認する（スラッシュなしは 308 リダイレクトされる）。
      #
      # Pages の反映には時間差があるため、初回 404 で落とさず 6 回まで 10 秒間隔で待つ
      # （最大 60 秒）。concurrency で次のデプロイが詰まるため、これ以上は待たない。
      - name: Verify deployed URLs
        run: |
          set -euo pipefail
          urls=(
            "https://ramentimer.keroway.com/"
            "https://ramentimer.keroway.com/privacy/"
          )
          for url in "${urls[@]}"; do
            code=""
            for attempt in $(seq 1 6); do
              code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)"
              if [ "$code" = "200" ]; then
                echo "ok: $url ($code, attempt $attempt)"
                break
              fi
              echo "retry $attempt/6: $url -> $code"
              sleep 10
            done
            if [ "$code" != "200" ]; then
              echo "::error::$url returned $code (expected 200)"
              exit 1
            fi
          done
