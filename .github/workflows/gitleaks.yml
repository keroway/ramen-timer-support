# 各リポジトリの .github/workflows/gitleaks.yml に配置する呼び出し元。
name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 0 * * 1"
  workflow_dispatch:

permissions:
  # CLI 版はスキャンのみで PR コメントを出さないため contents: read で足りる。
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    # SHA は keroway/.github の main（2026-09-05 時点でレビュー済み）に固定。更新手順は
    # docs/reusable-workflow-sha-pinning.md を参照。
    uses: keroway/.github/.github/workflows/reusable-gitleaks-cli.yml@2c7eddb9c4039a291aa3237b675d5a0fc001b85e
